<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Prueba QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

  <h1>Prueba del lector QR</h1>

  <div id="estado">Paso 1: HTML cargado</div>

  <div id="reader"></div>

  <script>
    const estado = document.getElementById("estado");

    estado.textContent = "Paso 2: JavaScript funcionando";

    setTimeout(function() {

      if (typeof Html5QrcodeScanner === "undefined") {

        estado.textContent =
          "❌ Paso 3: html5-qrcode NO cargó";

      } else {

        estado.textContent =
          "✅ Paso 3: html5-qrcode cargó correctamente";

        const scanner = new Html5QrcodeScanner(
          "reader",
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          false
        );

        scanner.render(
          function(decodedText) {
            estado.textContent =
              "QR detectado: " + decodedText;
          },
          function(error) {}
        );
      }

    }, 1000);
  </script>

</body>
</html>
