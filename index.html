<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro de asistentes</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
  text-align: center;
}

h1 {
  font-size: 24px;
  margin-bottom: 10px;
}

#estado {
  margin: 15px 0;
  font-size: 18px;
  font-weight: bold;
}

#reader {
  max-width: 500px;
  margin: 0 auto;
  background: white;
  border-radius: 12px;
  padding: 10px;
}

#resultado {
  max-width: 500px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 12px;
  display: none;
}

#nombre {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
}

#hora {
  font-size: 20px;
}

.exito {
  color: #16803c;
}

.error {
  color: #b42318;
}

</style>

</head>

<body>

<h1>Registro de asistentes</h1>

<div id="estado">
  Cargando lector QR...
</div>

<div id="reader"></div>

<div id="resultado">

  <div id="nombre"></div>

  <div id="hora"></div>

</div>


<script>

let procesando = false;

const estado = document.getElementById("estado");
const nombreElemento = document.getElementById("nombre");
const horaElemento = document.getElementById("hora");
const resultado = document.getElementById("resultado");


/* =========================
   MOSTRAR ÉXITO
========================= */

function mostrarExito(nombre) {

  const ahora = new Date();

  const fecha = ahora.toLocaleDateString("es-MX");

  const hora = ahora.toLocaleTimeString("es-MX", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });

  estado.textContent = "✓ Registro exitoso";

  estado.className = "exito";

  nombreElemento.textContent = nombre;

  horaElemento.textContent =
    fecha + " — " + hora;

  resultado.style.display = "block";


  if (navigator.vibrate) {
    navigator.vibrate(150);
  }

  reproducirSonido();


  setTimeout(function() {

    resultado.style.display = "none";

    estado.textContent = "Listo para escanear";

    estado.className = "";

    procesando = false;

  }, 1800);

}


/* =========================
   MOSTRAR ERROR
========================= */

function mostrarError(mensaje) {

  estado.textContent = "⚠ " + mensaje;

  estado.className = "error";

  procesando = false;

}


/* =========================
   SONIDO
========================= */

function reproducirSonido() {

  try {

    const contexto =
      new (window.AudioContext ||
           window.webkitAudioContext)();

    const oscilador =
      contexto.createOscillator();

    const ganancia =
      contexto.createGain();

    oscilador.frequency.value = 880;

    ganancia.gain.value = 0.08;

    oscilador.connect(ganancia);

    ganancia.connect(contexto.destination);

    oscilador.start();

    oscilador.stop(
      contexto.currentTime + 0.12
    );

  } catch (e) {}

}


/* =========================
   REGISTRAR EN GOOGLE SHEETS
========================= */

function registrarEnGoogleSheets(nombre) {

  estado.textContent =
    "Registrando en Google Sheets...";


  const url =
    "https://script.google.com/macros/s/AKfycbyds2CgLNBSW8ig6g2rV27U5bTlJlzYg3jGTCsDa0FQmy4eGslFZEsXOSOe_yEydrZ5/exec"
    + "?nombre="
    + encodeURIComponent(nombre);


  fetch(url, {
    method: "GET",
    mode: "no-cors"
  })

  .then(function() {

    /*
      No podemos leer la respuesta de Google
      debido a las restricciones del navegador.

      Pero si fetch termina, la petición
      ya fue enviada.
    */

    mostrarExito(nombre);

  })

  .catch(function(error) {

    console.error(error);

    mostrarError(
      "No se pudo enviar el registro."
    );

  });

}


/* =========================
   QR DETECTADO
========================= */

function onScanSuccess(decodedText) {

  if (procesando) {
    return;
  }

  procesando = true;

  estado.textContent =
    "QR detectado. Registrando...";


  registrarEnGoogleSheets(
    decodedText.trim()
  );

}


/* =========================
   ERRORES DEL LECTOR
========================= */

function onScanFailure(error) {

  // No hacemos nada.
}


/* =========================
   INICIAR LECTOR
========================= */

if (typeof Html5QrcodeScanner === "undefined") {

  estado.textContent =
    "❌ No se pudo cargar el lector QR";

} else {

  estado.textContent =
    "✓ Lector QR cargado. Iniciando cámara...";


  const scanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );


  scanner.render(
    onScanSuccess,
    onScanFailure
  );

}

</script>

</body>

</html>
