<!DOCTYPE html>

<html> <head> <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro de asistentes</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style> body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; text-align: center; } h1 { font-size: 24px; margin-bottom: 10px; } #estado { margin: 15px 0; font-size: 18px; font-weight: bold; } #reader { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; padding: 10px; } #resultado { max-width: 500px; margin: 20px auto; padding: 20px; background: white; border-radius: 12px; display: none; } #nombre { font-size: 24px; font-weight: bold; margin-bottom: 10px; } #hora { font-size: 20px; } .exito { color: #16803c; } .error { color: #b42318; } </style>

</head>

<body>

<h1>Registro de asistentes</h1>

<div id="estado"> Preparando cámara... </div>

<div id="reader"></div>

<div id="resultado">

<div id="nombre"></div>

<div id="hora"></div>

</div>

<script>

  const estado = document.getElementById('estado');

  estado.textContent = 'Cargando lector QR...';

  if (typeof Html5QrcodeScanner === 'undefined') {

    estado.textContent =
      '❌ No se pudo cargar el lector QR';

  } else {

    estado.textContent =
      '✓ Lector QR cargado. Iniciando cámara...';

    const scanner =
      new Html5QrcodeScanner(
        'reader',
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );

    scanner.render(

      function(decodedText) {

        estado.textContent =
          'QR detectado: ' + decodedText;

      },

      function(error) {

        // No hacemos nada
      }

    );

  }

</script>
</body> </html>
